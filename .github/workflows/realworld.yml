name: real-world

# yawntest on 15 open-source projects. A changed summary means a rule change moved findings
# there; see docs/real-world.md.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yawntest-corpus
          key: realworld-corpus-${{ hashFiles('internal/realworld/realworld_test.go') }}
          restore-keys: realworld-corpus-
      - run: go test -tags realworld ./internal/realworld -v -timeout 50m
