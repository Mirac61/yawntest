name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: gofmt, vet, Tests (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        # macOS too: changes resolves /var vs /private/var symlinks there.
        os: [ubuntu-latest, macos-latest]
        go: [stable]
        include:
          # The oldest Go that go.mod promises.
          - os: ubuntu-latest
            go: "1.23"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test -race ./...

  install:
    name: install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install from a local release
        run: .github/scripts/test-install.sh

  self-check:
    name: yawntest checks itself
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      # The CLI end to end on the example runs in go test (cmd/yawntest/main_test.go).
      - name: No untested candidates or error paths in yawntest
        run: go run ./cmd/yawntest check ./...

  action:
    name: The GitHub Action on the example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run the action
        id: yawntest
        uses: ./
        continue-on-error: true
        with:
          command: run
          working-directory: _example

      - name: It found the planted bugs
        env:
          EXIT_CODE: ${{ steps.yawntest.outputs.exit-code }}
        run: test "$EXIT_CODE" = 1
